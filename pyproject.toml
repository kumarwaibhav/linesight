[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linesight-inspect"
version = "1.0.0"
description = "CPU-first visual anomaly detection for bottle inspection with Isolation Forest"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Kumar Waibhav Akshat", email = "kwa.waibhav@gmail.com"}]
keywords = ["isolation-forest", "anomaly-detection", "computer-vision", "quality-inspection", "mvtec"]
dependencies = [
  "numpy>=2.2,<3", "scipy>=1.15,<2", "scikit-learn>=1.8,<1.9",
  "Pillow>=13,<14", "joblib>=1.5,<2", "matplotlib>=3.10,<4",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.11,<1", "build>=1,<2", "pip-audit>=2,<3"]
notebook = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
report = ["reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
