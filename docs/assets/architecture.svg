<text x="61" y="747" fill="#9cc8c3" font-size="16">The anomaly score is not a defect probability. Heatmaps are coarse evidence, not validated segmentation.</text><text x="50" y="825" fill="#6d8280" font-size="13">Research / portfolio implementation · benchmark replay is separate from camera inspection · no factory SLA claimed</text></g></svg>
