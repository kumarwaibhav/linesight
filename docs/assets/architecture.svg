<g font-family="Arial, Helvetica, sans-serif"><text x="50" y="59" fill="#132f3d" font-size="30" font-weight="700">One detector. A traceable path from data to decision.</text><text x="50" y="92" fill="#526b70" font-size="17">LineSight · visual anomaly inspection · Kumar Waibhav Akshat</text>
<rect x="36" y="124" width="1368" height="350" rx="15" fill="#e6eeea"/><text x="60" y="158" fill="#54716b" font-size="14" font-weight="700" letter-spacing="2">OFFLINE DEVELOPMENT &amp; EVALUATION</text>
