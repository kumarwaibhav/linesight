<g fill="#143440" font-size="20" font-weight="700"><text x="78" y="216">Dataset + manifest</text><text x="378" y="216">Normal fit images</text><text x="678" y="216">Tune + synthetic defects</text><text x="1058" y="216">Independent calibration</text><text x="378" y="367">Patch descriptors</text><text x="678" y="367">Isolation Forest</text><text x="1058" y="367">Frozen artifact</text></g>
<g fill="#596f73" font-size="16"><text x="78" y="244">MVTec AD bottle</text><text x="78" y="267">SHA-256 + explicit roles</text><text x="378" y="244">Only defect-free images</text><text x="378" y="267">Reference learned here</text><text x="678" y="244">Select detector configuration</text><text x="678" y="267">Real test set stays untouched</text><text x="1058" y="244">Normal-only score quantile</text><text x="1058" y="267">Fixed threshold before test</text><text x="378" y="395">Appearance + local residuals</text><text x="378" y="417">Spatial visual evidence</text><text x="678" y="395">Fit on normal descriptors</text><text x="678" y="417">Higher score = more unusual</text><text x="1058" y="395">Model + feature state + threshold</text><text x="1058" y="417">Evaluate once on official test set</text></g>
